name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy (strict, app + tests)
        run: uv run mypy
      - name: Unit & integration tests
        run: uv run pytest -q

  browser:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: End-to-end tests
        run: uv run pytest -q -m e2e --tracing retain-on-failure --output test-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  load:
    name: Load test smoke run
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - name: Locust smoke run (25 users, 15 s)
        env:
          LOAD_DURATION: "15"
          LOAD_MAX_P95_MS: "3000" # shared CI runners are slow and noisy
        run: uv run pytest -q -m load
