[project]
name = "resumeapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alex Maican" }
]
requires-python = ">=3.15"
dependencies = [
    "flask>=3.1.3",
    "aiosmtpd>=1.4.6",
]

[project.scripts]
resumeapp = "resumeapp:main"
resumeapp-smtp = "resumeapp.smtp_server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-playwright>=0.7.0",
    "locust>=2.40.0",
    "mypy>=1.18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Unit/integration tests run by default; browser and load tests are opt-in:
#   uv run pytest -m e2e      (needs: uv run playwright install chromium)
#   uv run pytest -m load
addopts = "-ra -m 'not e2e and not load'"
markers = [
    "e2e: end-to-end browser tests driven by Playwright (start a live server)",
    "load: volumetric load tests driven by Locust (start a live server)",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "loadtests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["aiosmtpd.*"]
ignore_missing_imports = true
