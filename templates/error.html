{% extends "base.html" %}

{% block title %}{{ code }} {{ name }} - {{ cv.personal.name }}{% endblock %}

{% block content %}
<main class="page-main">
    <section class="cv-card error-card">
        <p class="error-code">{{ code }}</p>
        <h1 class="page-title">{{ name }}</h1>
        <p class="page-subtitle">{{ description }}</p>
        <div class="error-actions">
            <a href="{{ url_for('pages.home') }}" class="btn btn-primary">Back to home</a>
            <a href="{{ url_for('contact.contact') }}" class="btn btn-secondary">Contact me</a>
        </div>
    </section>
</main>
{% endblock %}
